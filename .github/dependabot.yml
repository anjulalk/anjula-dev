version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      minor:
        applies-to: version-updates
        update-types:
          - minor
      patch:
        applies-to: version-updates
        update-types:
          - patch

  # The Congo theme is a submodule, so it moves with the theme's own releases.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
