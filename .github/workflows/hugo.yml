name: Build and deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # A pull request gets its own group, so a review build never queues in front
  # of the deployment that main is waiting on.
  group: pages-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Define tool versions
      DART_SASS_VERSION: 1.104.1
      GO_VERSION: 1.27.0
      HUGO_VERSION: 0.166.0
      NODE_VERSION: 24.20.0

      # Set the build time zone
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          echo "Logging tool versions..."
          command -v sass &> /dev/null && echo "Dart Sass: $(sass --version)" || echo "Dart Sass: not installed"
          command -v go &> /dev/null && echo "Go: $(go version)" || echo "Go: not installed"
          command -v hugo &> /dev/null && echo "Hugo: $(hugo version)" || echo "Hugo: not installed"
          command -v node &> /dev/null && echo "Node.js: $(node --version)" || echo "Node.js: not installed"

      - name: Configure Git
        run: |
          echo "Configuring Git..."
          git config --global core.quotepath false

      - name: Fetch full Git history
        run: |
          if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
            echo "Fetching full Git history..."
            git fetch --unshallow
          fi

      - name: Initialize Git submodules
        run: |
          if [[ -f .gitmodules ]]; then
            echo "Initializing Git submodules..."
            git submodule update --init --recursive
          fi

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            echo "Installing Node.js dependencies..."
            npm ci
          fi

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        run: |
          set -o pipefail
          echo "Building the project..."
          # The base URL comes from config/_default/hugo.toml. Overriding it with
          # the Pages output would publish http:// URLs in the sitemap, og:url
          # and og:image on a site that is served over https.
          hugo build \
            --gc \
            --minify \
            --cleanDestinationDir \
            --cacheDir "${{ runner.temp }}/.cache/hugo" 2>&1 | tee "$RUNNER_TEMP/build.log"

      # A warning is a broken link, a missing image or a template that fell
      # through, and it reaches the live site if nobody reads it.
      - name: Fail on a warning or an error
        run: |
          if grep -qiE '^(WARN|ERROR)' "$RUNNER_TEMP/build.log"; then
            echo "the build printed a warning or an error:"
            grep -iE '^(WARN|ERROR)' "$RUNNER_TEMP/build.log"
            exit 1
          fi
          echo "the build was clean"

      - name: Check the build output
        run: |
          echo "Checking the built site..."
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/index.xml
          test -f public/404.html
          test -f public/design/tokens.css
          test -f public/design/tailwind-theme.css
          test -f public/images/share.png
          grep -q "Sitemap:" public/robots.txt
          grep -q "og:image" public/index.html
          echo "pages: $(find public -name '*.html' | wc -l)"
          echo "size:  $(du -sh public | cut -f1)"

      # Pages serves one deployment and that one belongs to main, so a pull
      # request gets the built site as a downloadable artifact instead.
      - name: Attach the built site to the run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
